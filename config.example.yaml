# M7 Terminal configuration template.
#
# Copy to config.yaml and fill in. config.yaml is gitignored.
#
# Credentials do NOT belong here. Put them in .env instead:
#
#   TOSS_CLIENT_ID=c_xxxxxxxxxxxx
#   TOSS_CLIENT_SECRET=tssk_live_xxxxxxxxxxxx
#   GOOGLE_AI_API_KEY=xxxxxxxxxxxx
#   GOOGLE_APPLICATION_CREDENTIALS=/path/to/firebase-service-account.json
#
# From Phase 2 the Toss credential carries order-placement rights, so the
# environment is the only place it should live. All persistence (snapshots,
# signals, orders, the daily-bar cache) lives in Firestore, reached through
# the service account above - there is no db_path setting here anymore.

toss:
  # Optional. Omit to use the first account returned by /api/v1/accounts.
  account_no: null
  token_cache: ".toss_token.json"

portfolio:
  # Only holdings OUTSIDE the Toss account go here - Toss holdings are read
  # automatically. Name, currency and current price are filled in from the
  # Toss market data API, so only qty and avg_price are maintained by hand.
  manual:
    # Korean stock: 6-digit code, no .KS/.KQ suffix (those are stripped
    # automatically if present, so a v1 config still loads).
    - symbol: "000660"
      qty: 10
      avg_price: 180000

    # US stock. avg_exchange_rate is optional but recommended: Toss does not
    # report the rate that applied when you bought, and without it the return
    # for this position excludes FX gain/loss.
    - symbol: "AAPL"
      qty: 5
      avg_price: 180.0
      avg_exchange_rate: 1300.0

    # A leveraged or single-stock fund. `underlying` names the one company
    # it actually tracks, used only for the report's news search - a search
    # for the fund's own listed name ("DIREXION DAILY TSLA BULL 2X SHARES")
    # returns almost nothing useful; "TSLA" does.
    # - symbol: "TSLL"
    #   qty: 100
    #   avg_price: 13.0
    #   underlying: "TSLA"

    # An asset Toss does not list at all. No symbol, so supply price yourself.
    # - name: "금 현물"
    #   qty: 1
    #   avg_price: 5000000
    #   price: 5400000
    #   currency: "KRW"

  # Recurring safe-asset contributions outside this brokerage account - not
  # a position (no ticker, no market value looked up anywhere), just context
  # fed to the AI Analyst so its risk/allocation advice accounts for safe
  # assets already being built elsewhere (a 적금, a CMA, a pension, ...)
  # instead of judging this account's aggressiveness in isolation.
  # savings:
  #   - name: "청년미래적금"
  #     monthly_krw: 500000
  #     kind: "적금"

news:
  keywords:
    - "반도체"
    - "환율"

google_ai:
  # Prefer GOOGLE_AI_API_KEY in .env over putting the key here.
  model: "gemini-3.7-flash"
  # Reasoning depth: low / medium / high. "low" is plenty for a daily
  # summary; Gemini 3.x thinks at "medium" by default, which costs more
  # tokens and latency than this job needs. "off" omits the setting.
  thinking_level: "low"

notion:
  token: "secret_YOUR_NOTION_TOKEN_HERE"
  database_id: "YOUR_DATABASE_ID"
  page_title_prefix: "Financial Report"

# ---------------------------------------------------------------- 매매 (Phase 2)
#
# 기본은 꺼짐입니다. 매매 코드가 트리에 있다는 사실만으로 주문이 나가지
# 않도록, 켜는 것은 별도의 명시적인 편집이어야 합니다.
trading:
  enabled: false

  # 이 파일이 존재하면 모든 발주가 즉시 중단됩니다. 코드 수정도, 재시작도,
  # 어딘가에 로그인할 수 있는 상태도 필요 없습니다.
  kill_switch_path: "KILL_SWITCH"

  # 직접 작성한 전략을 module:Class 로 지정합니다. Strategy를 상속해야 하고,
  # evaluate(ctx) -> list[Signal] 안에서 I/O를 하면 안 됩니다 — 그 순수성이
  # 백테스트의 전제입니다.
  strategies: []
  # - src.strategy.momentum_dca:MomentumDcaStrategy

  limits:
    max_orders_per_day: 10              # 일일 주문 건수
    max_daily_notional_krw: 5000000     # 일일 누적 주문금액
    max_position_weight: 0.20           # 종목당 최대 비중 (주문 "후" 기준, 기본값)

    # 종목별 예외. 집중형 전략(예: momentum_dca)은 지수 ETF 한 종목에 비중이
    # 몰리는 것이 계획이지, 버그가 아닙니다 — 그 예외는 전략의 주장이 아니라
    # 여기 적힌 사실이어야 합니다. momentum_dca를 쓴다면 아래 예시를 참고하세요.
    # momentum_dca의 DEFAULT_UNIVERSE(src/strategy/universe.py)가 쓰는
    # max_weight와 정확히 맞춰 두었습니다 — 여기 값이 전략의 목표 비중보다
    # 낮으면 momentum_dca는 로드 시점에 즉시 실패합니다(의도된 동작: 매 주문마다
    # position-weight-limit로 거부되는 것보다 시작 전에 아는 편이 낫습니다).
    # 커스텀 유니버스를 쓴다면 각 종목의 max_weight에 맞게 조정하세요.
    max_position_weight_overrides:
      QQQ: 0.60
      AAPL: 0.35
      MSFT: 0.35
      NVDA: 0.35
      GOOGL: 0.35
      AMZN: 0.35
      META: 0.35
      TSLA: 0.35
      SOXX: 0.30
      SMH: 0.30
      QLD: 0.15   # 2배 레버리지 — 개별주보다 더 타이트하게
      SSO: 0.15

    # 이 금액 미만이면 비중 검사를 건너뜁니다. 전략의 첫 매수는 정의상 비중
    # 100%이므로, 이 면제가 없으면 시드가 작은 집중형 전략은 시작조차
    # 못 합니다.
    weight_check_min_equity_krw: 3000000

    # 1억 이상 주문은 confirmHighValueOrder가 필요합니다. 자동으로 켜지
    # 않습니다 — 켤 수 있는 봇은 버그 하나 거리에 있습니다.
    allow_high_value: false

    # 검증할 데이터가 없을 때(시세·캘린더·주문가능금액 조회 실패)의 태도.
    # true면 거부합니다. 확인하지 못한 주문은 안전한 주문이 아닙니다.
    strict: true

  # momentum_dca 등 전략별 파라미터. 전략마다 필요한 키가 다르므로 여기서는
  # 검증하지 않습니다 — 알 수 없는 키를 거부하는 건 각 전략의 from_config 몫.
  strategy_params: {}
  # top_n: 2
  # rebalance_weekday: 0        # 0=월요일
  # dislocation_drawdown: 0.08
  # cash_reserve: 0.05

  # OCO 손절 브라켓 (Phase 2 [9]) — 신호가 stop_loss_price/take_profit_price를
  # 실었을 때, 진입 체결이 확인되면 reconciler가 등록합니다.
  #
  # 만료일. 토스가 조건주문에 필수로 요구합니다 — 매매 판단이 아니라
  # "손절 감시를 얼마나 오래 켜둘지"일 뿐입니다.
  oco_expire_days: 30
  # 손절 주문가를 트리거가보다 이만큼 낮춰 넣습니다. 급락이 트리거를
  # 지정가보다 먼저 지나쳐버리면 주문이 아예 체결되지 않기 때문입니다.
  oco_stop_loss_slippage: 0.005

  # momentum_dca가 다룰 유니버스. 비워두면 코드 기본값
  # (src/strategy/universe.py의 DEFAULT_UNIVERSE)을 씁니다. 3배 이상 레버리지,
  # 인버스, 개별종목 레버리지 ETF(NVDL·TSLL 등)는 여기 적어도 로드 시점에
  # 거부됩니다 — src/strategy/universe.py의 정책 참조.
  universe: []
  # - {symbol: AAPL, name: Apple, kind: STOCK, max_weight: 0.35}
  # - {symbol: QQQ, name: "Invesco QQQ", kind: INDEX_ETF, max_weight: 0.60}
  # - {symbol: QLD, name: "ProShares Ultra QQQ", kind: INDEX_ETF, leverage: 2, max_weight: 0.15}
